<!DOCTYPE html>
<html>
<head>
    <title>Logo Generator</title>
</head>
<body>
    <canvas id="logoCanvas" width="120" height="120" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="downloadLogo()">Download Logo</button>
    <br><br>
    <canvas id="signatureCanvas" width="200" height="80" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="downloadSignature()">Download Signature</button>

    <script>
        // Create Logo
        function createLogo() {
            const canvas = document.getElementById('logoCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background circle
            ctx.fillStyle = '#0066cc';
            ctx.beginPath();
            ctx.arc(60, 60, 58, 0, 2 * Math.PI);
            ctx.fill();
            
            // Border
            ctx.strokeStyle = '#004d99';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // TWT Text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TWT', 60, 45);
            
            // International text
            ctx.font = '10px Arial';
            ctx.fillText('INTERNATIONAL', 60, 65);
            
            // Globe icon
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(60, 80, 12, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Globe lines
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(48, 80);
            ctx.quadraticCurveTo(60, 65, 72, 80);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(48, 80);
            ctx.quadraticCurveTo(60, 95, 72, 80);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(60, 68);
            ctx.lineTo(60, 92);
            ctx.stroke();
            
            // Decorative dots
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(30, 30, 3, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(90, 30, 3, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(30, 90, 3, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(90, 90, 3, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        // Create Signature
        function createSignature() {
            const canvas = document.getElementById('signatureCanvas');
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, 200, 80);
            
            // Signature line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(10, 40);
            ctx.quadraticCurveTo(30, 20, 50, 35);
            ctx.quadraticCurveTo(70, 50, 90, 30);
            ctx.quadraticCurveTo(110, 10, 130, 25);
            ctx.quadraticCurveTo(150, 40, 170, 20);
            ctx.quadraticCurveTo(180, 15, 190, 25);
            ctx.stroke();
            
            // Name text
            ctx.fillStyle = '#333';
            ctx.font = '14px cursive';
            ctx.fillText('TWT International', 10, 65);
            
            // Authorized text
            ctx.font = '10px Arial';
            ctx.fillStyle = '#666';
            ctx.fillText('Authorized Signature', 130, 65);
        }
        
        function downloadLogo() {
            const canvas = document.getElementById('logoCanvas');
            const link = document.createElement('a');
            link.download = 'twt-logo.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function downloadSignature() {
            const canvas = document.getElementById('signatureCanvas');
            const link = document.createElement('a');
            link.download = 'default-signature.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Create images on load
        window.onload = function() {
            createLogo();
            createSignature();
        };
    </script>
</body>
</html>
