<!-- SVG Logo for TWT International -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0066cc" stroke="#004d99" stroke-width="2"/>
  
  <!-- TWT Text -->
  <text x="60" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">TWT</text>
  
  <!-- International text -->
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">INTERNATIONAL</text>
  
  <!-- Globe icon -->
  <circle cx="60" cy="80" r="12" fill="none" stroke="white" stroke-width="2"/>
  <path d="M48 80 Q60 65 72 80" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M48 80 Q60 95 72 80" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="60" y1="68" x2="60" y2="92" stroke="white" stroke-width="1.5"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.7"/>
  <circle cx="90" cy="30" r="3" fill="white" opacity="0.7"/>
  <circle cx="30" cy="90" r="3" fill="white" opacity="0.7"/>
  <circle cx="90" cy="90" r="3" fill="white" opacity="0.7"/>
</svg>
