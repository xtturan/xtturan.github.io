<!DOCTYPE html>
<html>
<head>
    <title>Create Default Signature</title>
</head>
<body>
    <h2>Creating Default Signature...</h2>
    <canvas id="signatureCanvas" width="360" height="120" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="downloadSignature()">Download Signature</button>
    
    <script>
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        
        // Clear canvas with transparent background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Set signature style
        ctx.strokeStyle = '#0066cc';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.fillStyle = '#0066cc';
        ctx.font = 'bold 24px Arial';
        
        // Draw a professional signature for "TWT International"
        ctx.beginPath();
        
        // T
        ctx.moveTo(30, 30);
        ctx.lineTo(70, 30);
        ctx.moveTo(50, 30);
        ctx.lineTo(50, 80);
        
        // W
        ctx.moveTo(90, 30);
        ctx.lineTo(100, 80);
        ctx.lineTo(110, 50);
        ctx.lineTo(120, 80);
        ctx.lineTo(130, 30);
        
        // T
        ctx.moveTo(150, 30);
        ctx.lineTo(190, 30);
        ctx.moveTo(170, 30);
        ctx.lineTo(170, 80);
        
        // Decorative flourish
        ctx.moveTo(210, 55);
        ctx.quadraticCurveTo(240, 30, 270, 55);
        ctx.quadraticCurveTo(300, 80, 330, 55);
        
        // Underline
        ctx.moveTo(30, 90);
        ctx.lineTo(330, 90);
        
        ctx.stroke();
        
        // Add text below
        ctx.font = '14px Arial';
        ctx.fillText('Authorized Representative', 110, 110);
        
        function downloadSignature() {
            const link = document.createElement('a');
            link.download = 'default-signature.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Auto-generate and download
        setTimeout(downloadSignature, 1000);
    </script>
</body>
</html>
